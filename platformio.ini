[platformio]
default_envs = pillar1

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFIRMWARE_VERSION=\"1.0.0\"

; One environment per pillar: the id and the OTA target always go together.
[env:pillar1]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DPILLAR_ID=1

[env:pillar1-ota]
extends = env:pillar1
upload_protocol = espota
upload_port = stage-pillar-1.local
upload_flags =
    --auth=${sysenv.ESP_OTA_PASSWORD}

[env:pillar2]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DPILLAR_ID=2

[env:pillar2-ota]
extends = env:pillar2
upload_protocol = espota
upload_port = stage-pillar-2.local
upload_flags =
    --auth=${sysenv.ESP_OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
