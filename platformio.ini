[platformio]
default_envs = pillarR

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.6.0
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFIRMWARE_VERSION=\"1.0.0\"

; One environment per pillar side: the side and the OTA target always go together.
[env:pillarL]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DPILLAR_SIDE_L

[env:pillarL-ota]
extends = env:pillarL
upload_protocol = espota
upload_port = stage-pillar-l.local
upload_flags =
    --auth=${sysenv.ESP_OTA_PASSWORD}

[env:pillarR]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DPILLAR_SIDE_R

[env:pillarR-ota]
extends = env:pillarR
upload_protocol = espota
upload_port = stage-pillar-r.local
upload_flags =
    --auth=${sysenv.ESP_OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags = -std=c++17
